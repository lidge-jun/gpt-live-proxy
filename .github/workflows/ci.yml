name: CI

on:
  push:
    branches: [main]
  pull_request:

# Nothing is published, so the automatic GITHUB_TOKEN is scoped read-only. No
# repository or user secrets are supplied to any step; `actions/checkout` uses
# that automatic token, and `persist-credentials: false` below keeps it out of
# .git/config where a build script or test could read it.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      # Every action is pinned to an immutable COMMIT sha, not a tag. A tag can
      # be moved; a commit cannot. Verify a bump with
      # `gh api repos/<owner>/<repo>/commits/<sha>`, which fails for a tag object.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Untrusted build scripts, proc macros, and tests run in this job on a
          # fork PR; leaving the token in .git/config would expose it to them.
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable @ 2026-07-26
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - name: Formatting
        run: cargo fmt --all -- --check

      - name: Lints
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Tests
        run: cargo test --all-features

  # Keep the toolchain below in step with `rust-version` in Cargo.toml.
  msrv:
    name: msrv (1.86)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable @ 2026-07-26
        with:
          toolchain: "1.86"

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - name: Declared MSRV builds
        # The `check` job installs floating stable, so only this job can catch a
        # dependency quietly raising the floor.
        run: cargo check --all-targets --all-features
